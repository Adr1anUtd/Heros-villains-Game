<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/styles.css">
    <title>Heroes y Villanos</title>
</head>
<body>
    <main>
        <h1>Heroes y Villanos One Piece</h1>
        <img src="" alt="logo">

        <form action="./game.html" id="form">
            <div class="itemform">
                <label for="Nickname">Nickname</label>
                <input type="text" id="nickname">
            </div>
            <div class="itemform">
                <select name="dificulty" id="dificulty">
                    <option value="">--Selecciona dificultad del juego--</option>
                    <option value="1">Baja</option>
                    <option value="2">Media</option>
                    <option value="3">Alta</option>
                </select>
            </div>
            <div class="itemform">
                <select name="totalcards" id="totalcards">
                    <option value="">--Selecciona el numero de cartas--</option>
                    <option value="3">3x3</option>
                    <option value="4">4x4</option>
                    <option value="5">5x5</option>
                </select>
            </div>
            <div class="itemform">
                <input type="submit" value="JUGAR">
            </div>
        </form>
        <h3>Elige un avatar para jugar</h3>
        <section id="avatar-section">
            <div id="main-avatar">
                <img src="./media/luffymini.jpg" alt="" id="avatar-selected">
            </div>
            <div id="avatars">
                <div class="avatar"><img src="./media/luffymini.jpg" alt="" draggable="true"></div>
                <div class="avatar"><img src="./media/zoromini.jpg" alt="" draggable="true"></div>
                <div class="avatar"><img src="./media/namimini.jpg" alt="" draggable="true"></div>
                <div class="avatar"><img src="./media/kaidomini.jpg" alt="" draggable="true"></div>
                <div class="avatar"><img src="./media/doflamingomini.jpg" alt="" draggable="true"></div>
                <div class="avatar"><img src="./media/shirohigemini.jpg" alt="" draggable="true"></div>
            </div>
        </section>
        <div id="error"></div>
    </main>

    <script src="./JS/app.js"></script>
</body>
</html>
