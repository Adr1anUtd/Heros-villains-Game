<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./CSS/game.css">
    <title>Heroes y Villanos Game</title>
</head>
<body>
    <h1>Heroes y Villanos de One Piece</h1>
    <div class="container">
        <section id="gamecontainer">
            <div id="title">
                <h3>One Piece Card Game</h3>    
            </div>
            <div id="cardscontainer">
                <div class="card">
                    <img src="./media/back card design.png" alt="" class="cardback">
                    <img src="./media/heros/luffy.jpg" alt="" class="cardfront">
                </div>
                <div class="card">
                    <img src="./media/back card design.png" alt="" class="cardback">
                    <img src="./media/heros/zoro.jpg" alt="" class="cardfront">
                </div>
                <div class="card">
                    <img src="./media/back card design.png" alt="" class="cardback">
                    <img src="./media/heros/jinbe.jpg" alt="" class="cardfront">
                </div>
                <div class="card">
                    <img src="./media/back card design.png" alt="" class="cardback">
                    <img src="./media/heros/sanji.jpg" alt="" class="cardfront">
                </div>
            </div>
        </section>
        <section id="gamedata">
            <form action="">
                <img src="" alt="" id="avatar-game">
                <div>
                    <label for="game-user">Usuario</label>
                    <input type="text" id="game-user" readonly>
                </div>
                <div>
                    <label for="game-dificulty">Dificultad</label>
                    <input type="text" id="game-dificulty" readonly>
                </div>
                <div>
                    <label for="game-tries">Intentos</label>
                    <input type="text" id="game-tries" value="10" readonly>
                </div>
            </form>
        </section>
    </div>

    <script src="./JS/app.js"></script>
    <script src="./JS/game.js"></script>
</body>
</html>
